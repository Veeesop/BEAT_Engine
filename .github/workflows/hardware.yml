name: Accelerator qualification
on:
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [cuda, rocm, metal]
        required: true
jobs:
  qualify:
    runs-on: [self-hosted, "${{ inputs.backend }}"]
    env:
      BEAT_BACKEND: ${{ inputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # A runner may execute under a nonstandard user/home directory.
          # Put setup-python's toolcache under RUNNER_TEMP rather than
          # assuming the machine has a writable /Users/runner path.
          check-latest: false
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
      - run: python -m pip install -e .
      - run: python -m beat_engine instantiate --backend ${{ inputs.backend }}
      - run: python scripts/qualify_accelerator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-${{ inputs.backend }}
          path: doctor.json
